<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>词性识别设置 - 单词翻译助手</title>
  <link rel="stylesheet" href="css/pos-settings.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
    }
  </style>
</head>
<body>
  <div id="posSettingsRoot"></div>
  
  <script src="components/pos-settings-panel.js"></script>
  <script>
    // Initialize and show the settings panel
    document.addEventListener('DOMContentLoaded', async () => {
      const panel = new POSSettingsPanel();
      const root = document.getElementById('posSettingsRoot');
      const panelElement = panel.createPanel();
      
      // Remove fixed positioning for standalone page
      panelElement.style.position = 'relative';
      
      root.appendChild(panelElement);
      
      // Load configuration and stats
      await panel.loadConfig();
      await panel.loadStats();
      await panel.refreshServices();
    });
  </script>
</body>
</html>
