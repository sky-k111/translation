<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=520, initial-scale=1.0">
    <title>学习Dashboard</title>
    <style>
        /* 确保页面与popup保持一致的尺寸 */
        html, body {
            width: 520px;
            min-height: 600px;
            max-height: 800px;
        }
    </style>
    <link rel="stylesheet" href="../components/styles/reset.css">
    <link rel="stylesheet" href="../components/styles/variables.css">
    <link rel="stylesheet" href="../components/styles/utils.css">
    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="theme-dark dashboard-body">
    
    <div class="dashboard-container">
        <!-- 侧边栏 (Slim) -->
        <aside class="glass-sidebar">
            <a href="popup.html" class="sidebar-logo" title="返回首页">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-neon-blue">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                </svg>
            </a>
            <nav class="sidebar-menu">
                <a href="#overview" class="menu-item active" title="概览">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
                </a>
                <a href="#stats" class="menu-item" title="统计">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
                </a>
                <a href="#settings" class="menu-item" title="设置">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                </a>
            </nav>
            <div class="sidebar-footer">
                <img src="../icon16.png" alt="User" class="user-avatar">
            </div>
        </aside>

        <!-- 主内容区 (Bento Grid) -->
        <main class="dashboard-main">
            
            <!-- 1. Header Section -->
            <header class="content-header">
                <div class="header-welcome">
                    <h1 class="text-gradient">你好, <span id="userName">Learner</span> <span class="wave-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v0"></path><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v2"></path><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v8"></path><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"></path></svg></span></h1>
                    <p class="text-sub">准备好今天挑战新的语言目标了吗？</p>
                </div>
                <div class="header-status">
                    <div class="status-badge">
                        <span class="status-dot"></span>
                        状态: 学习中
                    </div>
                </div>
            </header>

            <!-- 2. Key Metrics Row -->
            <section class="metrics-grid">
                <!-- 由 JS 动态生成 -->
            </section>

            <!-- 3. Main Analytics Grid -->
            <section class="analytics-grid">
                <!-- Left: Activity Chart (Wide) -->
                <div class="glass-panel col-span-2 chart-panel">
                    <div class="panel-header">
                        <h3>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-neon-blue"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                            学习活跃度趋势
                        </h3>
                        <select class="glass-select">
                            <option>本周</option>
                            <option>上周</option>
                        </select>
                    </div>
                    <div class="chart-container" id="activityChartContainer">
                        <canvas id="activityChart"></canvas>
                    </div>
                </div>

                <!-- Right: AI Coach -->
                <div class="glass-panel ai-coach-panel">
                    <div class="panel-header">
                        <h3 class="text-neon-pink">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a8 8 0 0 1 8 8v8a2 2 0 0 1-2 2h-3a3 3 0 0 1-3-3v-5h-2v5a3 3 0 0 1-3 3H6a2 2 0 0 1-2-2v-8a8 8 0 0 1 8-8z"></path></svg>
                            AI 学习建议
                        </h3>
                    </div>
                    <div class="coach-content">
                        <!-- JS Generated -->
                    </div>
                </div>

                <!-- Middle Row: Efficiency & Radar -->
                <div class="glass-panel">
                    <div class="panel-header">
                        <h3 class="text-neon-amber">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
                            效率分析
                        </h3>
                    </div>
                    <div class="chart-container" id="efficiencyChartContainer">
                         <canvas id="efficiencyChart"></canvas>
                    </div>
                </div>

                <div class="glass-panel">
                    <div class="panel-header">
                        <h3 class="text-neon-emerald">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                            能力雷达
                        </h3>
                    </div>
                    <div class="chart-container" id="radarChartContainer">
                         <canvas id="radarChart"></canvas>
                    </div>
                </div>

                <div class="glass-panel scrollable-panel">
                    <div class="panel-header">
                        <h3>科目进度</h3>
                    </div>
                    <div class="progress-list" id="subjectProgressList">
                        <!-- JS 生成 -->
                    </div>
                </div>
            </section>

            <!-- 4. Bottom Section -->
            <section class="bottom-grid">
                <!-- Session History -->
                <div class="glass-panel col-span-2">
                    <div class="panel-header">
                        <h3>最近学习记录</h3>
                    </div>
                    <div class="table-container">
                        <table class="glass-table" id="sessionTable">
                            <thead>
                                <tr>
                                    <th>科目</th>
                                    <th>内容</th>
                                    <th>时长</th>
                                    <th>日期</th>
                                    <th>专注度</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- JS 生成 -->
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Goals -->
                <div class="glass-panel">
                    <div class="panel-header">
                        <h3>今日目标</h3>
                        <span class="badge-sm">1/3</span>
                    </div>
                    <div class="goals-list" id="goalsList">
                        <!-- JS 生成 -->
                    </div>
                    <button class="add-goal-btn">+ 添加新目标</button>
                </div>
            </section>

        </main>
    </div>

    <!-- 脚本引入 -->
    <script src="../components/utils/event-bus.js"></script>
    <script src="../components/utils/style-manager.js"></script>
    <script src="../components/utils/BaseComponent.js"></script>
    
    <!-- 可访问性工具 -->
    <script src="../utils/accessibility/KeyboardManager.js"></script>
    <script src="../utils/accessibility/ARIAManager.js"></script>
    <script src="../utils/accessibility/FocusManager.js"></script>
    <script src="../utils/accessibility/ColorContrastValidator.js"></script>
    
    <!-- 轻量级图表库 (替代 Chart.js) -->
    <script src="../components/charts/mini-chart.js"></script>
    
    <!-- 新增优化模块 -->
    <script src="modules/dashboard-store.js"></script>
    <script src="modules/smart-renderer.js"></script>
    <script src="modules/smart-coach.js"></script>
    <script src="modules/accessible-dashboard.js"></script>
    
    <!-- Dashboard 管理器和主逻辑 -->
    <script src="modules/dashboard-manager.js"></script>
    <script src="dashboard.js"></script>
    
    <!-- Level Up Modal Template -->
    <div id="levelModal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <h2 class="text-gradient" style="font-size: 24px; margin-bottom: 8px;">等级详情</h2>
            <div class="level-info" style="text-align: center; margin-bottom: 24px;">
                <div style="font-size: 48px; font-weight: 800; color: #38bdf8; text-shadow: 0 0 20px rgba(56,189,248,0.3);">Lv.<span id="modalLevel">1</span></div>
                <div style="color: #94a3b8; font-size: 14px;">当前 XP: <span id="modalXP" class="text-white">0</span> / <span id="modalNextXP">100</span></div>
            </div>
            
            <div class="level-progress-bar">
                <div class="level-progress-fill" id="modalProgressFill" style="width: 0%"></div>
            </div>
            
            <div class="xp-rules">
                <h3 style="color: #fff; font-size: 16px; margin-bottom: 16px;">如何获取 XP?</h3>
                <div class="rule-item">
                    <span>学习新单词</span>
                    <span class="xp-badge">+10 XP</span>
                </div>
                <div class="rule-item">
                    <span>完全掌握一个单词 (Lv.3+)</span>
                    <span class="xp-badge">+50 XP</span>
                </div>
                <div class="rule-item">
                    <span>每日打卡</span>
                    <span class="xp-badge">+100 XP</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
