<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <title>Dashboard 测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            min-width: 800px;
            min-height: 600px;
            background: #0f172a;
            color: white;
            font-family: sans-serif;
        }
        
        .test-container {
            display: flex;
            min-height: 100vh;
            width: 100%;
        }
        
        .sidebar {
            width: 80px;
            background: rgba(30, 41, 59, 0.8);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
        }
        
        .main {
            flex: 1;
            padding: 40px;
            min-width: 720px;
        }
        
        .test-box {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 32px;
            margin-bottom: 16px;
        }
        
        .info {
            color: #94a3b8;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="sidebar">
            <div style="width: 40px; height: 40px; background: #38bdf8; border-radius: 8px;"></div>
        </div>
        <div class="main">
            <h1>Dashboard 布局测试</h1>
            <div class="test-box">
                <h2>测试信息</h2>
                <div class="info">窗口宽度: <span id="width"></span>px</div>
                <div class="info">窗口高度: <span id="height"></span>px</div>
                <div class="info">最小宽度: 800px</div>
                <div class="info">最小高度: 600px</div>
            </div>
            <div class="test-box">
                <h3>如果你能看到这个页面正常显示，说明布局修复成功</h3>
                <p style="color: #94a3b8; margin-top: 12px;">
                    如果页面显示为细长条，请检查：<br>
                    1. CSS文件是否正确加载<br>
                    2. 是否有其他CSS覆盖了最小宽度设置<br>
                    3. 浏览器窗口是否太小
                </p>
            </div>
        </div>
    </div>
    
    <script>
        function updateSize() {
            document.getElementById('width').textContent = window.innerWidth;
            document.getElementById('height').textContent = window.innerHeight;
        }
        updateSize();
        window.addEventListener('resize', updateSize);
    </script>
</body>
</html>
