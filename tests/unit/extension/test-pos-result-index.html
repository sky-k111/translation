<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POSResultIndex Test Runner</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 {
      color: #333;
      border-bottom: 3px solid #4CAF50;
      padding-bottom: 10px;
    }
    .info {
      background: #e3f2fd;
      padding: 15px;
      border-radius: 5px;
      margin: 20px 0;
      border-left: 4px solid #2196F3;
    }
    .console {
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 20px;
      border-radius: 5px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      max-height: 600px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      margin: 10px 5px;
    }
    button:hover {
      background: #45a049;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .success {
      color: #4CAF50;
    }
    .error {
      color: #f44336;
    }
    .warning {
      color: #ff9800;
    }
  </style>
</head>
<body>
  <h1>POSResultIndex Test Runner</h1>
  
  <div class="info">
    <strong>Test Suite:</strong> POSResultIndex - Bidirectional POS result indexing<br>
    <strong>Purpose:</strong> Verify O(1) lookup performance and data integrity<br>
    <strong>Requirements:</strong> 8.1-8.7, 9.1-9.5, 10.1-10.5
  </div>

  <button id="runTests" onclick="runTests()">Run Tests</button>
  <button id="clearConsole" onclick="clearConsole()">Clear Console</button>
  
  <h2>Test Output:</h2>
  <div id="console" class="console">Waiting to run tests...</div>

  <!-- Load the POSResultIndex class -->
  <script src="pos-result-index.js"></script>
  
  <!-- Load the test suite -->
  <script src="pos-result-index-test.js"></script>
  
  <script>
    const consoleDiv = document.getElementById('console');
    const runButton = document.getElementById('runTests');
    
    // Capture console output
    const originalLog = console.log;
    const originalError = console.error;
    const originalWarn = console.warn;
    
    function appendToConsole(message, type = 'log') {
      const span = document.createElement('span');
      span.textContent = message + '\n';
      if (type === 'error') span.className = 'error';
      if (type === 'warn') span.className = 'warning';
      if (message.includes('✅')) span.className = 'success';
      if (message.includes('❌')) span.className = 'error';
      consoleDiv.appendChild(span);
      consoleDiv.scrollTop = consoleDiv.scrollHeight;
    }
    
    console.log = function(...args) {
      originalLog.apply(console, args);
      appendToConsole(args.join(' '), 'log');
    };
    
    console.error = function(...args) {
      originalError.apply(console, args);
      appendToConsole(args.join(' '), 'error');
    };
    
    console.warn = function(...args) {
      originalWarn.apply(console, args);
      appendToConsole(args.join(' '), 'warn');
    };
    
    async function runTests() {
      runButton.disabled = true;
      consoleDiv.innerHTML = '';
      
      try {
        await runPOSResultIndexTests();
        console.log('\n✅ Test suite completed successfully!');
      } catch (error) {
        console.error('\n❌ Test suite failed:', error.message);
        console.error(error.stack);
      } finally {
        runButton.disabled = false;
      }
    }
    
    function clearConsole() {
      consoleDiv.innerHTML = 'Console cleared. Click "Run Tests" to start.';
    }
    
    // Auto-run tests on load
    window.addEventListener('load', () => {
      console.log('Page loaded. Click "Run Tests" to begin.');
    });
  </script>
</body>
</html>
